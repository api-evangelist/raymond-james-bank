name: Raymond James Bank
kind: company
description: >-
  Raymond James Bank is a Florida-chartered state member bank headquartered in
  St. Petersburg, Florida, and a wholly owned subsidiary of Raymond James
  Financial, Inc. (NYSE: RJF), a diversified financial services holding company
  founded in 1962. Supervised by the Federal Reserve and the Florida Office of
  Financial Regulation, the bank provides securities-based lending, residential
  mortgages, commercial and industrial and commercial real estate loans, tax-exempt
  loans, and deposit products (including its Enhanced Savings Program) primarily to
  Raymond James wealth-management and institutional clients. On open finance, the
  bank runs no first-party public developer portal and publishes no downloadable
  API specifications; consumer-permissioned account data is reachable only
  indirectly through third-party aggregators such as Plaid. No FDX participation or
  CFPB Section 1033 data-access posture is publicly documented for this institution
  as of this record.
