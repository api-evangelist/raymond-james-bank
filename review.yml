aid: raymond-james-bank
name: Raymond James Bank
review:
  question: Does Raymond James Bank expose a public first-party developer API, downloadable specs, or a documented FDX / Section 1033 data-access posture?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Raymond James Bank publishes no first-party public developer API. The
    developer.raymondjamesbank.com subdomain does not resolve (DNS/connection
    failure), and the public site (https://www.raymondjamesbank.com/, HTTP 200)
    exposes no "Developers" or "APIs" surface, no API reference, and no
    downloadable OpenAPI/Swagger specification. The bank is a Florida-chartered
    state member bank and a subsidiary of Raymond James Financial, Inc. (NYSE:
    RJF), supervised by the Federal Reserve and the Florida Office of Financial
    Regulation. Consumer-permissioned data access is aggregator-mediated only:
    Open Banking Tracker lists Plaid as the connectivity path and lists "No API
    products" for the bank. No direct FDX (Financial Data Exchange) membership
    and no stated CFPB Section 1033 (Personal Financial Data Rights) posture are
    publicly documented for this specific institution. No authentication model
    (OAuth2/OIDC/API-key/mTLS) applies because no first-party API surface exists.
    No spec was harvested; none is publicly available.
  openFinancePosture:
    firstPartyDeveloperPortal: false
    developerPortalProbe: developer.raymondjamesbank.com does not resolve (connection failed)
    downloadableSpecs: false
    fdxParticipant: undocumented
    section1033Posture: undocumented
    aggregatorAccess:
      - Plaid
    authModel: none (no first-party API)
    specProvenance: none harvested
  transports:
    - protocol: REST
      scheme: https
      documented: false
      note: No public REST API is documented for Raymond James Bank.
    - protocol: FDX
      documented: false
      note: No FDX-conformant data-access API is publicly documented for this institution.
  urlsProbed:
