      status: 200
      note: Public marketing/banking site; no developer or API surface.
    - url: https://developer.raymondjamesbank.com/
      status: 000
      note: Does not resolve (no such host / connection failed).
    - url: https://www.raymondjamesbank.com/terms-of-use
      status: 200
    - url: https://www.raymondjamesbank.com/privacy-and-security-statements
      status: 200
    - url: https://www.raymondjamesbank.com/more/contact-us
      status: 200
